name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Unique per push commit so queued main runs are never replaced; per PR otherwise.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Full contract on Node 24, the publish runtime.
  ci:
    # contents: write is for the profile's publish-evidence job only (main
    # pushes); the profile's required job declares contents: read.
    permissions:
      contents: write
    uses: KyaniteLabs/.github/.forgejo/workflows/ci-profile.yml@acc41fc663d5b1ef623a406fddff912823b29f93
    with:
      publish_evidence: true
      image: node:24-bookworm@sha256:6449e19d8184d84062525b6a7524def03146c2cb04a7f08b076680d0e8e4240a
  # Engines floor (>=22): build, tests with coverage thresholds, and the
  # Node-dependent data/contract scripts must also pass on Node 22.
  node-22-floor:
    name: node-22-floor
    runs-on: docker
    container:
      image: node:22-bookworm@sha256:63538dfe497cc29dfafdda25ada09b46db68a3f4cc205abf1f5d6bf0913f3384
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - run: corepack enable pnpm && pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run build
      - run: pnpm exec vitest run --coverage
      - name: Epoch Hermes Desktop regression tests (Node 22)
        run: node --experimental-vm-modules plugins/epoch-hermes/tests/test_pane_events.mjs
      - run: node scripts/validate-community-data.mjs
      - run: node scripts/verify-reference-db.mjs
      - run: pnpm run contract:llms-full
  # The Hermes plugin under the Hermes release it is tested against: unit, desktop API and
  # real-Hermes multi-process e2e tests. Only the real-CLI test may skip here (no Node build in
  # this image); the GitHub Node job runs it against dist/.
  epoch-hermes-plugin:
    name: epoch-hermes-plugin
    runs-on: docker
    timeout-minutes: 20
    container:
      image: python:3.14-bookworm@sha256:3fe825da0a80fa8e2cd79baadeb76b03c0ddf3d6cdbc8346778a0208b9d6038c
    steps:
      - name: Install checkout runtime (actions/checkout needs node + git)
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git nodejs
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Fetch the tested Hermes runtime (v0.23.0, pinned by commit)
        run: |
          git init -q .hermes-runtime
          git -C .hermes-runtime fetch -q --depth 1 https://github.com/NousResearch/hermes-agent 2bd378ed1b8d6bf2192cb26e0a55ff3091e6bd19
          git -C .hermes-runtime checkout -q FETCH_HEAD
      - name: Install Hermes from its own lockfile
        run: python3 -m pip install --no-cache-dir uv==0.11.22 && uv sync --frozen --python 3.14 --directory .hermes-runtime
      - name: Validate Epoch manifest with real Hermes
        shell: bash
        run: |
          PY="$PWD/.hermes-runtime/.venv/bin/python"
          uv pip install --python "$PY" pytest==8.4.2 hypothesis==6.135.0
          H=$(mktemp -d)
          HOME="$H" HERMES_AGENT_SRC="$PWD/.hermes-runtime" HERMES_PYTHON="$PY" \
            "$PY" -m pytest plugins/epoch-hermes/tests/test_real_plugin_validate.py -q
      - name: Plugin tests under Hermes (fails on any unexpected skip)
        shell: bash
        run: |
          set -o pipefail
          PY="$PWD/.hermes-runtime/.venv/bin/python"
          uv pip install --python "$PY" pytest==8.4.2 hypothesis==6.135.0 ruff==0.15.12
          "$PY" -m ruff check --select F --exclude plugins/epoch-hermes/tests plugins/epoch-hermes
          H=$(mktemp -d)
          HOME="$H" HERMES_HOME="$H/hermes" HERMES_AGENT_SRC="$PWD/.hermes-runtime" HERMES_PYTHON="$PY" \
            "$PY" -m pytest plugins/epoch-hermes/tests -q -rs | tee pytest.out
          if grep '^SKIPPED' pytest.out | grep -v 'test_real_epoch.py'; then echo "unexpected skip"; exit 1; fi
  # requires_hermes is ">=0.21.6": the same tests under the oldest supported release.
  epoch-hermes-plugin-floor:
    name: epoch-hermes-plugin-floor
    runs-on: docker
    timeout-minutes: 20
    container:
      image: python:3.14-bookworm@sha256:3fe825da0a80fa8e2cd79baadeb76b03c0ddf3d6cdbc8346778a0208b9d6038c
    steps:
      - name: Install checkout runtime (actions/checkout needs node + git)
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends git nodejs
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Fetch the tested Hermes runtime (v0.21.6, pinned by commit)
        run: |
          git init -q .hermes-runtime
          git -C .hermes-runtime fetch -q --depth 1 https://github.com/NousResearch/hermes-agent 818c13be1dc4fd28987e1e881a9408224afd4535
          git -C .hermes-runtime checkout -q FETCH_HEAD
      - name: Install Hermes from its own lockfile
        run: python3 -m pip install --no-cache-dir uv==0.11.22 && uv sync --frozen --python 3.14 --directory .hermes-runtime
      - name: Validate Epoch manifest with real Hermes
        shell: bash
        run: |
          PY="$PWD/.hermes-runtime/.venv/bin/python"
          uv pip install --python "$PY" pytest==8.4.2 hypothesis==6.135.0
          H=$(mktemp -d)
          HOME="$H" HERMES_AGENT_SRC="$PWD/.hermes-runtime" HERMES_PYTHON="$PY" \
            "$PY" -m pytest plugins/epoch-hermes/tests/test_real_plugin_validate.py -q
      - name: Plugin tests under Hermes (fails on any unexpected skip)
        shell: bash
        run: |
          set -o pipefail
          PY="$PWD/.hermes-runtime/.venv/bin/python"
          uv pip install --python "$PY" pytest==8.4.2 hypothesis==6.135.0 ruff==0.15.12
          "$PY" -m ruff check --select F --exclude plugins/epoch-hermes/tests plugins/epoch-hermes
          H=$(mktemp -d)
          HOME="$H" HERMES_HOME="$H/hermes" HERMES_AGENT_SRC="$PWD/.hermes-runtime" HERMES_PYTHON="$PY" \
            "$PY" -m pytest plugins/epoch-hermes/tests -q -rs | tee pytest.out
          if grep '^SKIPPED' pytest.out | grep -v 'test_real_epoch.py'; then echo "unexpected skip"; exit 1; fi
