name: epoch
version: "0.9.0"
manifest_version: 2
requires_hermes: ">=0.21.6"
description: "Epoch for Hermes Kanban: when a worker claims a task, post a calibrated P50/P90 (plus P80/P95) Monte Carlo estimate as a task comment; when it completes, record that run's wall-clock hours back to Epoch's local ledger (calibration_provenance auto_wallclock, so Epoch's sanity gate applies) so estimates calibrate over time. The estimate-to-run link lives in a shared bindings file next to the ledger (Kanban comments are display/audit only), so dispatcher and worker profiles can differ. Also adds /epoch, an epoch_estimate tool, and a Hermes Desktop page that charts a card's Monte Carlo spread (read-only: it never writes the ledger). Disclosure — shells out to `npx -y @kyanitelabs/epoch@0.8.0` (downloads from npm on first run; needs Node >=22), passing the task's title and three-point hint to the local CLI; the child env is scrubbed (only these variables reach it, when set: PATH, HOME, USER, LOGNAME, LANG, LC_ALL, LC_CTYPE, TZ, TMPDIR, TMP, TEMP, SYSTEMROOT, COMSPEC, PATHEXT, APPDATA, LOCALAPPDATA, USERPROFILE, XDG_CACHE_HOME, XDG_CONFIG_HOME, NODE_EXTRA_CA_CERTS, NVM_DIR, NVM_BIN, VOLTA_HOME, FNM_DIR, npm_config_cache, npm_config_registry, npm_config_prefix, npm_config_userconfig (and their upper-case forms), HTTP_PROXY, HTTPS_PROXY, NO_PROXY (and lower-case), SSL_CERT_FILE, SSL_CERT_DIR; NODE_OPTIONS is always dropped; the parent environment and its secrets are never passed through); ledger and run bindings live under <HERMES_HOME>/plugin-data/epoch/ (shared by all profiles; override with epoch_data_dir); Epoch telemetry is forced off for plugin runs (EPOCH_TELEMETRY=0); no network besides the npm download, no API key; hook work runs on a short-lived background thread; /epoch refuses serve, self-improve and telemetry/data mutations, and refuses actuals and calibration writes on gateway platforms unless opted in, and ledger reads (task text from every profile) unless allow_ledger_read_on_gateway is set (estimates still append to the local ledger); jobs it gives up on after retries go to dead-letter.jsonl next to the ledger and are counted in /epoch data status."
author: "Kyanite Labs"
license: Apache-2.0
homepage: https://github.com/KyaniteLabs/Epoch/tree/main/plugins/epoch-hermes
tags: [kanban, estimation, monte-carlo, pert, planning]
requires_env: []
provides_tools:
  - epoch_estimate
  - epoch_show
provides_hooks:
  - kanban_task_claimed
  - kanban_task_completed
  - on_kanban_dispatch_tick
hooks:
  - kanban_task_claimed
  - kanban_task_completed
  - on_kanban_dispatch_tick
config_schema:
  epoch_command:
    type: str
    default: "npx -y @kyanitelabs/epoch@0.8.0"
    description: "Command prefix used to invoke the Epoch CLI (e.g. 'epoch' if installed globally)."
  comment_on_claim:
    type: bool
    default: true
  record_actuals:
    type: bool
    default: true
  iterations:
    type: int
    default: 5000
  timeout_seconds:
    type: int
    default: 60
  epoch_data_dir:
    type: str
    default: ""
    description: "Optional EPOCH_DATA_DIR for the Epoch ledger + run bindings. Default: <HERMES_HOME root>/plugin-data/epoch (shared by every profile). Set e.g. ~/.epoch to reuse a standalone Epoch ledger."
  shutdown_wait_seconds:
    type: int
    default: 20
    description: "Bounded wait at process exit for in-flight Epoch work; unfinished jobs replay from the outbox on next load."
  allow_write_slash_on_gateway:
    type: bool
    default: false
    description: "Allow /epoch ledger-writing commands (record-actual, batch-record-actuals, auto-actuals, mine-git, calibrate-estimates) from gateway platforms such as Telegram or Discord."
  allow_ledger_read_on_gateway:
    type: bool
    default: false
    description: "Allow /epoch commands that read the Epoch ledger (get-pending-estimates, accuracy-trend, feedback-health, data status, reference-class-estimate, ...) from gateway platforms. The ledger holds task text from every profile. Pure calculators are always allowed."
