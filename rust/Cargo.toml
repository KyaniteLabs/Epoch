[workspace]
resolver = "2"
members = [
  "crates/epoch-contract",
  "crates/epoch-core",
  "crates/epoch-data",
  "crates/epoch-mcp",
  "crates/epoch-cli",
  "crates/epoch-http",
  "crates/epoch-canary",
  "crates/xtask",
]

[workspace.package]
edition = "2024"
rust-version = "1.93"
license = "Apache-2.0"
repository = "https://github.com/KyaniteLabs/Epoch"

[workspace.dependencies]
anyhow = "1"
schemars = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
