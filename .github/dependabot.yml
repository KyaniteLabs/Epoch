version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: zod
        versions: ["4.x"]
      - dependency-name: typescript
        versions: ["6.x"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    # One PR per week for all minor/patch bumps instead of one PR (and one CI run) each.
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - ci
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci-deps)"
