name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  test:
    name: Typecheck, build, and test (Node ${{ matrix.node-version }})
    runs-on: blacksmith-2vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        # Node floor is >= 22 (engines). 24 is the publish runtime.
        node-version: ["22", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit
        # Using --audit-level=critical: high-severity findings are in transitive deps
        # from @modelcontextprotocol/sdk (ajv>fast-uri, express>qs). These are
        # upstream issues that require the MCP SDK to update its dependencies.
        # Epoch itself has no direct use of these packages.
        run: pnpm audit --audit-level=critical

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Check ops scripts
        run: pnpm run ops:check

      - name: Test
        # Invoked directly: `pnpm test -- --coverage` forwards the literal `--`
        # to vitest, which silently disables coverage (and threshold gates).
        run: pnpm exec vitest run --coverage

      - name: Build
        run: pnpm run build

      - name: Validate community data
        run: node scripts/validate-community-data.mjs

      - name: Verify reference database
        run: node scripts/verify-reference-db.mjs

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b # v3.97.1
        with:
          extra_args: --only-verified

  fleet-ip-gate:
    name: Fleet IP hygiene gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Check for fleet IPs in public surface
        run: node scripts/check-no-fleet-ips.mjs
