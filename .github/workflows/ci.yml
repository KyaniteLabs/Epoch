name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  test:
    name: Typecheck, build, and test (Node ${{ matrix.node-version }})
    runs-on: blacksmith-2vcpu-ubuntu-2404
    strategy:
      fail-fast: false
      matrix:
        # Node floor is >= 22 (engines). 24 is the publish runtime.
        node-version: ["22", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security audit
        # Using --audit-level=critical: high-severity findings are in transitive deps
        # from @modelcontextprotocol/sdk (ajv>fast-uri, express>qs). These are
        # upstream issues that require the MCP SDK to update its dependencies.
        # Epoch itself has no direct use of these packages.
        run: pnpm audit --audit-level=critical

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Check ops scripts
        run: pnpm run ops:check

      - name: Test
        # Invoked directly: `pnpm test -- --coverage` forwards the literal `--`
        # to vitest, which silently disables coverage (and threshold gates).
        run: pnpm exec vitest run --coverage

      - name: Epoch Hermes Desktop regression tests
        run: node --experimental-vm-modules plugins/epoch-hermes/tests/test_pane_events.mjs

      - name: Build
        run: pnpm run build

      - name: Hermes plugin tests (Python)
        # Native regression tests for plugins/epoch-hermes: fake-Epoch unit tests plus the
        # auto_wallclock gate against the dist/ CLI built above. The real-Hermes multi-process
        # e2e and desktop tests run in the epoch-hermes-plugin job below, under real Hermes.
        run: |
          python3 -m venv /tmp/epoch-hermes-venv
          /tmp/epoch-hermes-venv/bin/pip install --quiet "pytest==8.4.2" "hypothesis==6.135.0" "ruff==0.15.12"
          /tmp/epoch-hermes-venv/bin/ruff check --select F --exclude plugins/epoch-hermes/tests plugins/epoch-hermes
          /tmp/epoch-hermes-venv/bin/python -m pytest plugins/epoch-hermes/tests -q

      - name: Validate community data
        run: node scripts/validate-community-data.mjs

      - name: Verify reference database
        run: node scripts/verify-reference-db.mjs

      - name: Check llms-full contract (holidaySupport + two-letter country note)
        run: pnpm run contract:llms-full

  secret-scan:
    name: Secret scanning
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@d411fff7b8879a62509f3fa98c07f247ac089a51 # v3.95.5
        with:
          extra_args: --only-verified

  epoch-hermes-plugin:
    # The Hermes plugin under the Hermes release it is tested against: desktop API and
    # real-Hermes multi-process e2e tests, which the Node job above skips.
    name: Hermes plugin under Hermes ${{ matrix.hermes }}
    strategy:
      fail-fast: false
      matrix:
        # requires_hermes is ">=0.21.6": test the floor as well as the newest release.
        include:
          - hermes: v0.21.6
            ref: 818c13be1dc4fd28987e1e881a9408224afd4535
          - hermes: v0.23.0
            ref: 2bd378ed1b8d6bf2192cb26e0a55ff3091e6bd19
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
      - name: Checkout tested Hermes runtime
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ matrix.ref }}  # ${{ matrix.hermes }}
          path: .hermes-runtime
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
      - name: Install Hermes from its own lockfile
        run: uv sync --frozen --python 3.14 --directory .hermes-runtime
      - name: Validate Epoch manifest with real Hermes
        shell: bash
        run: |
          PY="$PWD/.hermes-runtime/.venv/bin/python"
          uv pip install --python "$PY" pytest==8.4.2 hypothesis==6.135.0
          H=$(mktemp -d)
          HOME="$H" HERMES_AGENT_SRC="$PWD/.hermes-runtime" HERMES_PYTHON="$PY" \
            "$PY" -m pytest plugins/epoch-hermes/tests/test_real_plugin_validate.py -q
      - name: Plugin tests under Hermes (fails on any unexpected skip)
        shell: bash
        run: |
          set -o pipefail
          PY="$PWD/.hermes-runtime/.venv/bin/python"
          uv pip install --python "$PY" pytest==8.4.2 hypothesis==6.135.0
          H=$(mktemp -d)
          HOME="$H" HERMES_HOME="$H/hermes" HERMES_AGENT_SRC="$PWD/.hermes-runtime" HERMES_PYTHON="$PY" \
            "$PY" -m pytest plugins/epoch-hermes/tests -q -rs | tee pytest.out
          if grep '^SKIPPED' pytest.out | grep -v 'test_real_epoch.py'; then echo "unexpected skip"; exit 1; fi

  fleet-ip-gate:
    name: Fleet IP hygiene gate
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Check for fleet IPs in public surface
        run: node scripts/check-no-fleet-ips.mjs
