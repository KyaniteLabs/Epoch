name: Registry republish (tech.kyanitelabs)

# Dispatch-only: republishes this repo's server.json to the MCP Registry under
# the DNS-proven tech.kyanitelabs namespace. Mirrors the proven kinocut
# publish.yml pattern (mcp-publisher 1.8.1, login http --domain kyanitelabs.tech,
# duplicate-tolerant publish, post-publish live read-back). CEO-gated act
# executed 2026-10-27 per t_0d11c90c.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-mcp-registry:
    name: Publish server.json to MCP Registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: "1.8.1"
        run: |
          curl -fsSL -o mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher --help
      - name: Require the registry domain key
        env:
          MCP_REGISTRY_DNS_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_DNS_PRIVATE_KEY }}
        run: |
          if [ -z "$MCP_REGISTRY_DNS_PRIVATE_KEY" ]; then
            echo "::error::MCP_REGISTRY_DNS_PRIVATE_KEY is not available to this repo; tech.kyanitelabs/* cannot be published."
            exit 1
          fi
      - name: Publish server metadata (duplicate-tolerant)
        env:
          MCP_REGISTRY_DNS_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_DNS_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          registry_key="$(printf '%s' "$MCP_REGISTRY_DNS_PRIVATE_KEY" | tr -cd '0-9a-fA-F' | head -c 64)"
          if [ "${#registry_key}" -ne 64 ]; then
            echo "::error::key is not a 64-hex Ed25519 seed"; exit 1
          fi
          ./mcp-publisher validate server.json
          ./mcp-publisher login http --domain kyanitelabs.tech --private-key "$registry_key"
          name="$(python3 -c "import json;print(json.load(open('server.json'))['name'])")"
          version="$(python3 -c "import json;print(json.load(open('server.json'))['version'])")"
          encoded="$(python3 -c "import urllib.parse;print(urllib.parse.quote('${name}',safe=''))")"
          published="$(curl -fsSL "https://registry.modelcontextprotocol.io/v0/servers/${encoded}/versions" \
            | python3 -c "import json,sys;print('\n'.join(e['server']['version'] for e in json.load(sys.stdin).get('servers',[])))" || true)"
          if printf '%s\n' "$published" | grep -qx "$version"; then
            echo "$name $version already published; nothing to do."
          else
            if ! out="$(./mcp-publisher publish server.json 2>&1)"; then
              if printf '%s' "$out" | grep -q "duplicate version"; then
                echo "$name $version already published (duplicate accepted); nothing to do."
              else
                printf '%s\n' "$out" >&2; exit 1
              fi
            else
              printf '%s\n' "$out"
            fi
          fi
      - name: Post-publish verify (live registry read-back)
        run: |
          set -euo pipefail
          name="$(python3 -c "import json;print(json.load(open('server.json'))['name'])")"
          version="$(python3 -c "import json;print(json.load(open('server.json'))['version'])")"
          encoded="$(python3 -c "import urllib.parse;print(urllib.parse.quote('${name}',safe=''))")"
          curl -fsSL "https://registry.modelcontextprotocol.io/v0/servers/${encoded}/versions" \
            | python3 -c "
          import json,sys
          rows=json.load(sys.stdin).get('servers',[])
          hit=[r for r in rows if r['server']['version']=='$version']
          assert hit, 'published version not found in registry read-back'
          pkgs=hit[0]['server'].get('packages') or []
          print('VERIFIED', '$name', '$version', 'packages:', [p['identifier'] for p in pkgs])
          "
