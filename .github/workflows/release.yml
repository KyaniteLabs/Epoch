name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Verify mirror is reconciled with canonical main
        # This workflow triggers after the tag already exists on the mirror, so
        # the only place to block a diverged publish is here, before npm. The
        # tagged commit must be contained in canonical main (Forgejo); a tag
        # that never landed canonically means the mirror is diverged and must
        # not ship.
        env:
          CANONICAL_REMOTE: https://git.kyanitelabs.tech/KyaniteLabs/Epoch.git
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse --is-shallow-repository)" == "true" ]]; then
            git fetch --quiet --unshallow origin
          fi
          git fetch --quiet --no-tags "$CANONICAL_REMOTE" +refs/heads/main:refs/remotes/canonical/main
          tagged="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          canonical="$(git rev-parse refs/remotes/canonical/main)"
          echo "Tagged commit:   $tagged"
          echo "Canonical main:  $canonical"
          if git merge-base --is-ancestor "$tagged" "$canonical"; then
            echo "OK: tag ${GITHUB_REF_NAME} is contained in canonical main; mirror is reconciled."
          else
            echo "::error::Mirror diverged from canonical main: tag ${GITHUB_REF_NAME} ($tagged) is not contained in canonical main ($canonical). Publish blocked."
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Verify npm package surface
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --access public --provenance

  publish-mcp-registry:
    name: Publish to MCP Registry
    needs: publish
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: "0.3.0"
        run: |
          ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          URL="https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_${OS}_${ARCH}.tar.gz"
          echo "Downloading mcp-publisher v${MCP_PUBLISHER_VERSION} from ${URL}"
          curl -fsSL -o mcp-publisher.tar.gz "${URL}"
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher --help
          rm -f mcp-publisher.tar.gz
      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc
      - name: Publish server metadata
        run: ./mcp-publisher publish
