name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Verify mirror is reconciled with canonical main
        # This workflow triggers after the tag already exists on the mirror, so
        # the only place to block a diverged publish is here, before npm. The
        # tagged commit must be contained in canonical main (Forgejo); a tag
        # that never landed canonically means the mirror is diverged and must
        # not ship.
        env:
          CANONICAL_REMOTE: https://git.kyanitelabs.tech/KyaniteLabs/Epoch.git
          FORGEJO_RO_TOKEN: ${{ secrets.FORGEJO_RO_TOKEN }}
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse --is-shallow-repository)" == "true" ]]; then
            git fetch --quiet --unshallow origin
          fi
          tagged="$(git rev-parse "${GITHUB_SHA}^{commit}")"
          echo "Tagged commit:   $tagged"
          # Primary transport: anonymous git fetch of canonical (Forgejo).
          # Fallback transport: Forgejo REST compare (some runner networks are
          # auth-challenged on git smart-http). Both fail CLOSED: if neither
          # transport can prove containment, publish stays blocked.
          verdict="unproven"
          if git fetch --quiet --no-tags "$CANONICAL_REMOTE" +refs/heads/main:refs/remotes/canonical/main 2>/tmp/gate-fetch.err; then
            canonical="$(git rev-parse refs/remotes/canonical/main)"
            echo "Canonical main:  $canonical (git transport)"
            if git merge-base --is-ancestor "$tagged" "$canonical"; then
              verdict="ok"
            else
              echo "::error::Mirror diverged from canonical main: tag ${GITHUB_REF_NAME} ($tagged) is not contained in canonical main ($canonical). Publish blocked."
              exit 1
            fi
          else
            echo "git transport to canonical failed (see below); trying Forgejo REST compare."
            cat /tmp/gate-fetch.err || true
            auth_args=()
            if [[ -n "${FORGEJO_RO_TOKEN:-}" ]]; then auth_args=(-H "Authorization: token ${FORGEJO_RO_TOKEN}"); fi
            canonical="$(curl -fsS --max-time 20 "${auth_args[@]}" "https://git.kyanitelabs.tech/api/v1/repos/KyaniteLabs/Epoch/branches/main" | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"]["id"])')"
            echo "Canonical main:  $canonical (API transport)"
            if curl -fsS --max-time 20 -o /dev/null "${auth_args[@]}" "https://git.kyanitelabs.tech/api/v1/repos/KyaniteLabs/Epoch/compare/${canonical}...${tagged}"; then
              verdict="ok"
            else
              echo "::error::API compare says tag ${GITHUB_REF_NAME} ($tagged) is not reachable from canonical main ($canonical). Publish blocked."
              exit 1
            fi
          fi
          if [[ "$verdict" == "ok" ]]; then
            echo "OK: tag ${GITHUB_REF_NAME} is contained in canonical main; mirror is reconciled."
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Stamp release surfaces from package.json
        # Ticket 09: server.json / llms.txt version strings derive from
        # package.json at release time — a forgotten hand-edit can never ship
        # a stale version on a published surface. Stamps in-place in this
        # checkout before the artifacts are consumed.
        run: node scripts/stamp-release-versions.mjs

      - name: Verify npm package surface
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --access public --provenance

  publish-mcp-registry:
    name: Publish to MCP Registry
    needs: publish
    if: startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      # Job-level so step-level `if:` conditions can actually see it: a step's
      # `if` is evaluated BEFORE the step's own `env:` mapping is applied, so
      # the pre-#217 form (`env:` on the guarded step itself) always compared
      # against an empty job-level value — the steps skipped even WITH a token.
      MCP_REGISTRY_TOKEN: ${{ secrets.MCP_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - name: Install mcp-publisher
        # Skipped cleanly when no registry token is configured — the npm publish
        # above is the release of record; registry metadata is additive.
        if: env.MCP_REGISTRY_TOKEN != ''
        env:
          MCP_PUBLISHER_VERSION: "1.8.1"
        run: |
          ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          OS=$(uname -s | tr '[:upper:]' '[:lower:]')
          URL="https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_${OS}_${ARCH}.tar.gz"
          echo "Downloading mcp-publisher v${MCP_PUBLISHER_VERSION} from ${URL}"
          curl -fsSL -o mcp-publisher.tar.gz "${URL}"
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher --help
          rm -f mcp-publisher.tar.gz
      - name: Authenticate to MCP Registry
        if: env.MCP_REGISTRY_TOKEN != ''
        run: ./mcp-publisher login github-oidc
      - name: Stamp server.json version from package.json
        # Same derivation as the npm job: server.json's published version must
        # match package.json even if the committed file drifted.
        if: env.MCP_REGISTRY_TOKEN != ''
        run: node scripts/stamp-release-versions.mjs
      - name: Publish server metadata
        # Was unguarded pre-#217-fix: with no token the install step skips, the
        # binary never exists, and this step fails — turning every tokenless
        # release red. Same guard closes the loop.
        if: env.MCP_REGISTRY_TOKEN != ''
        run: ./mcp-publisher publish
