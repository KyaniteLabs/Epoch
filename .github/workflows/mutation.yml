name: Mutation

# Advisory Layer 2 lane: measures whether the tests detect injected defects in
# the core estimator. Not a required check (about 15 min). The run goes red if
# the mutation score drops below 80% (baseline 84.7%, 2026-10-25). Moved from
# Forgejo CI (fleet GIT-CI-STRATEGY-20261123): weekly, on a GitHub-hosted
# runner, which is free for public repos.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  mutation:
    name: mutation-score
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Mutation score of the core estimator (break below 80%)
        run: pnpm exec stryker run stryker.config.json
      - name: Retain the mutation report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: warn
          retention-days: 30
