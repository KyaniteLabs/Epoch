name: Mutation

# Advisory Layer 2 lane: measures whether the tests detect injected defects in
# the core estimator. Not a required check (about 15 min). The run goes red if
# the mutation score drops below 80% (baseline 84.7%, 2026-10-25). Moved from
# Forgejo CI (fleet GIT-CI-STRATEGY-20261123): weekly, on a GitHub-hosted
# runner, which is free for public repos.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  mutation:
    name: mutation-score
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6
      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Mutation score of the core estimator (break below 80%)
        run: pnpm exec stryker run stryker.config.json
      - name: Retain the mutation report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: warn
          retention-days: 30
