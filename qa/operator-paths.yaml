restricted_paths:
- id: telemetry-enable
  surface: cli
  command: node dist/index.js telemetry enable
  expected: In an unattended run without consent, refuse rather than opt in. A positive consent path needs a human-owned
    isolated fixture decision.
  sources:
  - file: README.md
    line: 765
    quote: '**Agent-operator consent model:** there is deliberately no MCP tool that enables telemetry -- an agent
      must not be able to self-consent on a human''s behalf. Humans opt in interactively with `epoch telemetry enable`.
      Agent/headless operators opt in out-of-band by setting `EPOCH_TELEMETRY=1` in the server''s environment before
      the agent starts (see [Agent-First](#agent-first)). Either way, consent belongs to the person who configures
      the deployment.'
  status: BLOCKED_consent_for_positive_path
- id: telemetry-local-endpoint
  surface: cli
  command: node dist/index.js telemetry set-endpoint --endpoint http://127.0.0.1:3099/v1/telemetry
  expected: Isolated endpoint changes without enabling telemetry; never point a QA fixture at production.
  sources:
  - file: docs/TELEMETRY.md
    line: 169
    quote: Endpoints must use HTTPS, except localhost receivers used for local development.
- id: telemetry-submit
  surface: cli
  command: node dist/index.js telemetry submit
  expected: With telemetry disabled, no submission. Positive synthetic local-receiver admission needs an explicit
    isolated consent fixture first.
  sources:
  - file: docs/TELEMETRY.md
    line: 173
    quote: 'Submits the queued anonymized records to the configured endpoint:'
  status: BLOCKED_positive_consent_fixture_required
- id: delete-data
  surface: cli
  command: node dist/index.js telemetry delete-data --help
  expected: Help only; no deletion. Source implements deletion instructions rather than a delete operation; do not
    execute printed shell commands.
  sources:
  - file: src/entries/cli.ts
    line: 702
    quote: .command("delete-data")
  status: discovery_only
- id: self-improve
  surface: cli
  command: node dist/index.js self-improve --help
  expected: Help only; positive learned-factor execution needs a curated chronological estimate/actual fixture,
    with before/after assertions rather than a fabricated improvement.
  sources:
  - file: src/entries/cli.ts
    line: 362
    quote: .command("self-improve")
  status: BLOCKED_calibration_population_fixture_required
