schema_version: 1
status: draft_incomplete
run_status: NOT_EXECUTED
policy:
  pass: Every required action executes and meets its observable assertion on the Security-merged default-branch
    SHA.
  blocked: Missing fixture, dependency, consent or path assertions prevent a full pass; discovery/help never count
    as end-to-end execution.
  evidence: For every path retain exact command/request, SHA, exit/HTTP code, stdout/stderr, asserted observations
    and hashes; screenshots for rendered UI. Sanitize before delivery.
  isolation: New clone/install; empty HOME and XDG dirs for product subprocesses only; isolated state per transport;
    no real user data or credentials; retain evidence outside scratch cleanup.
  resources: One bounded product test at a time; tiny fixtures, one FFmpeg thread, no bulk benchmark/model download.
  change_control: Catalog and qa/run.sh changes require a repository PR and Security merge. No runner exists in
    this draft; execute listed actions by hand.
product: Epoch
repository: KyaniteLabs/Epoch
source_revision: 68404e56750b22638d7ae0a7cd77f0dbd9d9a0f3
revision_policy: Local-source provenance only; fetch/verify the actual Security merge SHA during QA and install
  that checkout.
setup:
- id: configure
  surface: configure
  command: 'mkdir -p "$QA_WORK/home" "$QA_WORK/config" "$QA_WORK/cache" "$QA_WORK/data-cli" "$QA_WORK/data-mcp"
    "$QA_WORK/data-http"

    export HOME="$QA_WORK/home" XDG_CONFIG_HOME="$QA_WORK/config" XDG_CACHE_HOME="$QA_WORK/cache" EPOCH_DATA_DIR="$QA_WORK/data-cli"
    EPOCH_TELEMETRY=0 EPOCH_SOURCE=qa-fixture'
  expected: All writes remain in disposable test state; telemetry remains disabled and no user ledger is loaded.
    Use a distinct data directory for each surface to avoid duplicate-feedback contamination.
  sources:
  - file: README.md
    line: 752
    quote: '| `EPOCH_DATA_DIR` | `~/.epoch/` | Data directory for feedback and self-improvement |'
- id: install
  surface: install
  command: 'pnpm install --frozen-lockfile

    pnpm run build'
  expected: Exit 0; dist/index.js built from the merge SHA; Node >=22 and pnpm version match package metadata.
  sources:
  - file: README.md
    line: 651
    quote: 'From a source checkout, after `pnpm install` and `pnpm run build`, the same CLI is `dist/index.js`.
      CI runs this block on every change, and each `# expect:` line must appear in the output, so these examples
      cannot drift from the code:'
- id: http-launch
  surface: http
  command: EPOCH_DATA_DIR="$QA_WORK/data-http" EPOCH_TELEMETRY=0 EPOCH_HOST=127.0.0.1 node dist/index.js serve --port
    3099
  expected: A new test process listens only on a free loopback port; /health returns status=ok. Never stop or replace
    an existing listener. Capture/terminate only this test PID after QA.
  sources:
  - file: README.md
    line: 669
    quote: epoch serve --port 3099
feedback_fixture_protocol:
  cli_prepare: 'node dist/index.js pert-estimate --optimistic 2 --most-likely 4 --pessimistic 12 --unit hours >
    "$QA_WORK/estimate.json"

    ESTIMATE_ID=$(python3 -c ''import json,sys; print(json.load(open(sys.argv[1]))["data"]["feedbackRef"])'' "$QA_WORK/estimate.json")

    node dist/index.js pert-estimate --optimistic 2 --most-likely 4 --pessimistic 12 --unit hours > "$QA_WORK/batch-estimate.json"

    BATCH_ESTIMATE_ID=$(python3 -c ''import json,sys; print(json.load(open(sys.argv[1]))["data"]["feedbackRef"])''
    "$QA_WORK/batch-estimate.json")

    export ESTIMATE_ID BATCH_ESTIMATE_ID'
  other_surfaces: For MCP/HTTP generate two fresh PERT estimates through that same transport; capture each returned
    data.feedbackRef into ESTIMATE_ID and BATCH_ESTIMATE_ID for that surface. Substitute exact values in JSON, never
    literal placeholders or synthetic ids.
  source:
    file: src/dispatcher/tool-registry.ts
    line: 1211
    quote: 'synthetic_id: `Estimate ID "${p.estimate_id}" looks like test/synthetic data (reserved prefix), so it
      cannot receive actuals. Use the feedbackRef returned by a fresh estimation-tool call.`,'
