- id: get_current_time
  surfaces:
  - cli
  - mcp
  - http
  commands:
    cli: node dist/index.js get-current-time --timezone America/Los_Angeles
    mcp_launch: EPOCH_DATA_DIR="$QA_WORK/data-mcp" EPOCH_TELEMETRY=0 node dist/index.js
    http: 'curl --fail-with-body -sS -X POST http://127.0.0.1:3099/v1/tools/get_current_time -H ''Content-Type:
      application/json'' --data ''{"timezone":"America/Los_Angeles"}'''
  mcp_request:
    jsonrpc: '2.0'
    id: 3
    method: tools/call
    params:
      name: get_current_time
      arguments:
        timezone: America/Los_Angeles
  expected: CLI exits 0 / HTTP 200 / MCP isError is not true; structured result ok=true. data.timezone is America/Los_Angeles
    and iso is a parseable current instant.
  substitutions: None.
  sources:
