    line: 603
    quote: '- **Inspect your data:** `epoch data where` and `epoch data status` show what''s stored locally.'
- id: data-status
  surface: cli
  command: node dist/index.js data status
  expected: Counts/health/config match only the fresh fixture ledger.
  sources:
  - file: README.md
    line: 589
    quote: '`reference_class_estimate`''s correction factors are the same learned mechanism applied to a different
      tool. Track its current calibration with `epoch data status` or `feedback_health` (per-tool MAPE/MdAPE, bias,
      and trend), or generate a full calibration decision-surface report with `node scripts/build-calibration-dashboard.mjs`
      -- also strictly read-only against your ledger.'
- id: auto-actuals
  surface: cli
  command: node dist/index.js auto-actuals --session qa-fixture --dry-run
  expected: Empty unmatched session writes no actuals and reports the empty candidate set honestly.
  sources:
  - file: README.md
    line: 567
    quote: '**The loop can close itself.** Recording actuals is the step everyone forgets, so Epoch can do it for
      you: `epoch auto-actuals --session <id>` records wall-clock-derived actuals for a session''s unfinished estimates
      (agent hosts can wire it into a session-end hook). Auto-recorded actuals are sanity-bounded (0.05–12h, <10x
      the estimate), provenance-labeled `auto_wallclock`, never overwrite a real actual, and `feedback_health` reports
      them separately (`byProvenance`) so automated data can''t silently skew your calibration.'
- id: mine-git
  surface: cli
  command: node dist/index.js mine-git --repo "$QA_WORK/checkout" --since 2026-11-01 --dry-run
  expected: Offline read of the test clone; no fetch or repository mutation; reports both cycle windows separately
    where anchors exist.
  sources:
  - file: README.md
    line: 571
    quote: '**Your git history is another actuals source.** `epoch mine-git --repo <path> --since <date>` walks
      a local git repository — offline and read-only by construction — and joins pending estimates to closed work
      (merged PRs and plain merges) via the identity keys planning flows already stamp: `task_label`, `branch`,
      or `issue_ref`. Two cycle-time windows are derived per unit and reported separately, never blended: first-commit→merge
      (provenance `git_derived`) and open→merge (provenance `git_derived_review_inclusive`, computed wherever a
      branch-creation anchor survives locally — plain clones have none, and the window is never fabricated). Pick
      the recorded window with `--window dev|review-inclusive`; the other rides along in the actual''s notes. Mined
      actuals are sanity-bounded ([0.05h, 720h] — calendar windows legitimately span nights and weekends — and <10x
      the estimate), never overwrite a real actual, and `feedback_health` segments them in its own `byProvenance`
      bucket (`gitDerived`) so calendar-window noise cannot silently skew calibration.'
