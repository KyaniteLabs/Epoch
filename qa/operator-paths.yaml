- id: http-record-actual
  surface: http
  command: 'curl --fail-with-body -sS http://127.0.0.1:3099/v1/feedback/record-actual -H ''Content-Type: application/json''
    --data "$(python3 -c ''import json,os; print(json.dumps({"estimate_id":os.environ["ESTIMATE_ID"],"actual_hours":5}))'')"'
  expected: 'Fresh feedbackRef: 200 with camelCase estimateId/actualHours/recorded. Duplicate: 409; invalid input:
    400. Use a fresh HTTP estimate so the tool case has not already recorded it.'
  sources:
  - file: README.md
    line: 690
    quote: '| `POST /v1/feedback/record-actual` | `{estimate_id, actual_hours, notes?}`. Success is `{estimateId,
      actualHours, recorded, flagged?, flagHint?}` (camelCase). Status: 400 for bad input or a caller-fixable rejection
      (`below_threshold`, `synthetic_id`, `unknown_tool`, a failed auto or git sanity gate); **409** for a duplicate;
      500 for a storage failure. | `record_actual`: success is `{recorded, estimate_id, actual_hours, message, flagged?,
      flagHint?}` (snake_case). Every failure is a 422 whose message names the reason. |'
- id: http-batch
  surface: http
  command: 'curl --fail-with-body -sS http://127.0.0.1:3099/v1/feedback/batch-record-actuals -H ''Content-Type:
    application/json'' --data "$(python3 -c ''import json,os; print(json.dumps({"entries":[{"estimate_id":os.environ["BATCH_ESTIMATE_ID"],"actual_hours":5},{"estimate_id":"qa-invalid","actual_hours":-1}]}))'')"'
  expected: Fresh real entry succeeds and invalid entry is reported by index; partial success is distinguished from
    tools batch validation. Body is the source-verified {entries:[...]} object, not a top-level array.
  sources:
  - file: README.md
    line: 692
    quote: '| `POST /v1/feedback/batch-record-actuals` | 1–500 entries. **Partial success:** valid entries are recorded,
      and each invalid one is reported in `errors` by index. If none succeed, 422, or 500 when the cause is storage.
      | `batch_record_actuals`: Zod validates every entry first, so **one invalid entry rejects the whole batch**
      (422) before anything is recorded. |'
  - file: src/entries/http.ts
    line: 968
    quote: const entries = (body as Record<string, unknown>)["entries"];
